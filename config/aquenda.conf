# Configuração da VM do Aquenda. Os scripts leem este arquivo; segredo nenhum fica aqui.
# Segredos (chave da Adzuna, chave de operador) vão em /etc/aquenda/segredos.env, fora do Git:
#   ADZUNA_APP_ID=...
#   ADZUNA_APP_KEY=...
#   CHAVE_OPERADOR=...

# ---- rede (01-infra.sh) -------------------------------------------------------
HOSTNAME_VM="aquenda-srv"
DOMINIO="aquenda.local"
# Interface que recebe o IP fixo. Em VirtualBox: a placa "host-only" (enp0s8);
# a placa NAT (enp0s3) continua no DHCP e dá a saída para a internet.
INTERFACE_FIXA="enp0s8"
IP_FIXO="192.168.56.10/24"
DNS_SERVIDORES="1.1.1.1 8.8.8.8"
FUSO="America/Sao_Paulo"
PORTAS_ABERTAS="22 5000 8000"

# ---- aplicação (02-app.sh) ----------------------------------------------------
USUARIO_APP="aquenda"
BASE="/opt/aquenda"
DADOS="/var/lib/aquenda"
SEGREDOS="/etc/aquenda"
LOGS="/var/log/aquenda"

REPO_API="https://github.com/Lynnbrosa/GS-c--AQUENDA.git"
BRANCH_API="rinku/loving-planck-r47bz4"
REPO_JOBS="https://github.com/Lynnbrosa/GS-SOA-AQUENDA.git"
BRANCH_JOBS="rinku/affectionate-darwin-9ejh4z"

PORTA_API=5000
PORTA_JOBS=8000
BANCO_JOBS="aquenda_soa"

# ---- monitoramento (03-monitor.sh) --------------------------------------------
LIMITE_CPU=80
LIMITE_MEMORIA=85
LIMITE_DISCO=90
INTERVALO_MONITOR=15   # segundos entre medições no serviço
